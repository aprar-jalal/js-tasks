<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css">
    <title>Document</title>
</head>
<body>
    <section class="edit-user">
        <div class="container big-container">
            <h1>Edit user</h1>
             <div class="text-danger"></div>
            <form class="create-form ">
                <input name="userName" type="text" placeholder="user name .. " class="user-name" required />
                <input name="email" type="email" placeholder="user email .. " class="user-email" disabled />
                <input name="phone" type="text" placeholder="user phone .. " class="user-phone" disabled/>
                <button type="submit" class="btn btn-success">UpDate</button>
            </form>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./update.js"></script>
</body>
</html>
